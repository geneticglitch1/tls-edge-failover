# Main Advanced tab of the NEW edge-health.example.com Proxy Host only.
# It exposes only this small static marker; no application content is served here.
if ($uri != /__edge_health) {
    return 404;
}
location = /__edge_health {
    default_type text/plain;
    add_header Cache-Control "no-store, max-age=0" always;
    return 200 "edge-ok-v1\n";
}
